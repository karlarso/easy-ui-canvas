  }
  main { max-width: 960px; margin: 0 auto; padding: 48px 20px 64px; }

  p { margin: 0 0 12px; font-size: 1.05rem; line-height: 1.6; }
  .en { color: #56626c; }
  nav { display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0 28px; }
  a {
    display: inline-block;
    padding: 10px 16px;

  a.github { background: #fff; color: #2c3a45; border: 1px solid #e4e7eb; }

    border-radius: 12px;
  }

<main>
  <h1>Easy UI Canvas</h1>
