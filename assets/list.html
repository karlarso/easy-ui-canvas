<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--UIC-I18N-->
<link rel="icon" href="data:,">
<title data-i18n="l.title">Canvas list · Easy UI Canvas</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f6f8;color:#1f2430}
header{padding:26px 28px 10px}
header h1{margin:0 0 4px;font-size:22px}
header p{margin:0;color:#6b7280;font-size:13px}
main{padding:12px 28px 40px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid #eef0f3;vertical-align:top}
th{font-size:12px;color:#6b7280;background:#fafbfc;font-weight:600}
tr:last-child td{border-bottom:0}
td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.name a{color:#2563eb;text-decoration:none;font-weight:600}
.name a:hover{text-decoration:underline}
.name .plain{font-weight:600}
.sub{color:#9ca3af;font-size:12px;word-break:break-all}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600}
.running{background:#dcfce7;color:#166534}
.stopped{background:#e5e7eb;color:#374151}
.unresponsive{background:#fee2e2;color:#991b1b}
.actions button{font:inherit;font-size:13px;padding:4px 11px;margin-right:6px;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer}
.actions button:hover:not(:disabled){background:#f3f4f6}
.actions button:disabled{opacity:.45;cursor:not-allowed}
.actions button.danger{color:#b91c1c;border-color:#fecaca}
.actions .mlink{display:inline-block;font:inherit;font-size:13px;line-height:1.5;padding:4px 11px;margin-right:6px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:#2563eb;text-decoration:none;vertical-align:top}
.actions a.mlink:hover{background:#f3f4f6}
.actions .mlink.off{opacity:.45;cursor:not-allowed;color:#6b7280}
.empty{padding:28px;text-align:center;color:#6b7280}
#msg{margin:10px 0 0;min-height:20px;font-size:13px;color:#b91c1c}
#msg.ok{color:#166534}
footer{padding:0 28px 30px;color:#9ca3af;font-size:12px}
@media(max-width:700px){th:nth-child(5),td:nth-child(5){display:none}main{padding:12px 10px}}
.lang{float:right;font-size:13px;color:#6b7280}.lang select{font:inherit;font-size:13px;padding:2px 6px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
</style>
</head>
<body>
<header><div class="lang"><label for="lang-select" data-i18n="l.lang">Language</label> <select id="lang-select"><option value="auto" data-i18n="l.langAuto">Auto (browser)</option><option value="zh">中文</option><option value="en">English</option></select></div><h1 data-i18n="h.canvas_list">Canvas list</h1><p data-i18n="c.loading" id="summary">Loading…</p><p id="msg" role="alert"></p></header>
<main>
<table data-i18n-aria-label="l.tableLabel" id="table" aria-label="Canvases">
<thead><tr><th data-i18n="l.colId">ID</th><th data-i18n="l.colName">Name</th><th data-i18n="l.colPort">Port</th><th data-i18n="l.colStatus">Status</th><th data-i18n="l.colCreated">Created</th><th data-i18n="l.colActions">Actions</th></tr></thead>
<tbody id="rows"><tr><td data-i18n="c.loading" colspan="6" class="empty">Loading…</td></tr></tbody>
</table>
</main>
<footer data-i18n="l.footer">Removing only moves the canvas directory into trash/ inside the runtime directory; it can be restored. This page has no authentication: use it on trusted networks only.</footer>
<script>
(function(){
'use strict';
var rowsEl=document.getElementById('rows'),summaryEl=document.getElementById('summary'),msgEl=document.getElementById('msg');
var busy={},timer=null,STATUS={running:tr('l.st.running'),stopped:tr('l.st.stopped'),unresponsive:tr('l.st.unresponsive')};
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function say(text,ok){msgEl.textContent=text||'';msgEl.className=ok?'ok':''}
function canvasUrl(c){return location.protocol+'//'+location.hostname+':'+c.port+'/'}
// Fallback when the server omits display_id. Keep in sync with frameRefCanvasLabel in canvas.js
// (this page does not load that file): server display_id wins; otherwise '#' + digits unless the id is exactly 6 digits.
function canvasLabel(c){if(c.display_id)return c.display_id;var id=String(c.id||'');return /^[1-9]\d*$/.test(id)&&id.length!==6?'#'+id:id}
function canvasPath(c){return '/api/canvases/'+encodeURIComponent(c.id)}
function when(v){if(!v)return '';var d=new Date(v);return isNaN(d.getTime())?String(v):d.toLocaleString()}
async function api(method,path,body){
  var opts={method:method,cache:'no-store'};
  if(body!==undefined){opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(body)}
  var res=await fetch(path,opts);
  var data={};try{data=await res.json()}catch(e){}
  if(!res.ok)throw new Error(data.error||tr('l.reqFailed',{status:res.status}));
  return data;
}
function button(label,cls,disabled,title,handler){
  var b=el('button',cls,label);b.type='button';b.disabled=!!disabled;if(title)b.title=title;b.addEventListener('click',handler);return b;
}
function render(list){
  rowsEl.textContent='';
  summaryEl.textContent=tr('l.summary',{n:list.length,time:new Date().toLocaleTimeString()});
  if(!list.length){var row=el('tr'),td=el('td','empty',tr('l.empty'));td.colSpan=6;row.append(td);rowsEl.append(row);return}
  list.forEach(function(c){
    var row=el('tr');row.dataset.id=c.id;
    row.append(el('td','mono',canvasLabel(c)));
    var nameTd=el('td','name');
    if(c.status==='running'){
      var a=el('a','',c.name);a.href=canvasUrl(c);a.target='_blank';a.rel='noopener';nameTd.append(a);
    }else nameTd.append(el('span','plain',c.name));
    var sub=[];if(c.status_note)sub.push(c.status_note);if(c.project_path)sub.push(c.project_path);
    if(sub.length)nameTd.append(el('div','sub',sub.join(' · ')));
    row.append(nameTd);
    row.append(el('td','mono',String(c.port)));
    var st=el('td');st.append(el('span','badge '+c.status,STATUS[c.status]||c.status));row.append(st);
    row.append(el('td','sub',when(c.created_at)));
    var act=el('td','actions'),isBusy=!!busy[c.id];
    var pv;
    if(c.status==='running'){pv=el('a','mlink',tr('h.mobile_preview'));pv.href=canvasUrl(c)+'m/';pv.target='_blank';pv.rel='noopener';pv.title=tr('l.mobileTitle')}
    else{pv=el('span','mlink off',tr('h.mobile_preview'));pv.setAttribute('aria-disabled','true');pv.title=tr('l.mobileOff')}
    act.append(pv);
    if(!c.metadata_missing)act.append(button(tr('l.rename'),'',isBusy,tr('l.renameTitle'),function(){renameCanvas(c)}));
    if(c.status==='stopped'&&!c.metadata_missing)act.append(button(tr('l.start'),'',isBusy,tr('l.startTitle'),function(){start(c)}));
    if(c.status==='running'||(c.status==='unresponsive'&&!c.metadata_missing))act.append(button(tr('l.stop'),'',isBusy,tr('l.stopTitle'),function(){stop(c)}));
    act.append(button(tr('l.remove'),'danger',isBusy||c.status==='running',c.status==='running'?tr('l.removeRunning'):tr('l.removeTitle'),function(){remove(c)}));
    row.append(act);rowsEl.append(row);
  });
}
async function refresh(){
  try{var data=await api('GET','/api/canvases');render(data.canvases)}
  catch(e){summaryEl.textContent=tr('l.readFail',{msg:e.message})}
}
async function act(c,method,path,doing,done){
  if(busy[c.id])return;busy[c.id]=true;say(doing+' '+c.name+'…',true);await refresh();
  try{var r=await api(method,path);say(done(r),true);return r}
  catch(e){say(e.message,false)}
  finally{busy[c.id]=false;await refresh()}
}
async function renameCanvas(c){
  // 100 matches NAME_MAX in scripts/canvas.py. The server trims and checks again.
  if(busy[c.id])return;
  var next=window.prompt(tr('l.renamePrompt',{name:c.name}),c.name==null?'':String(c.name));
  if(next===null)return;
  var trimmed=String(next).trim();
  if(!trimmed||trimmed.length>100){say(tr('s.nameLen'),false);return}
  if(busy[c.id])return;
  busy[c.id]=true;say(tr('l.renaming')+' '+c.name+'…',true);
  try{
    var data=await api('POST',canvasPath(c)+'/rename',{name:trimmed});
    var label=rowsEl.querySelector('tr[data-id="'+c.id+'"] .name a, tr[data-id="'+c.id+'"] .name .plain');
    if(label)label.textContent=data.name||trimmed;
    say(tr('l.renamed',{name:data.name||trimmed}),true);
  }catch(e){say(e.message,false)}
  finally{busy[c.id]=false;await refresh()}
}
async function start(c){
  await act(c,'POST',canvasPath(c)+'/start',tr('l.starting'),function(r){return tr('l.started',{name:c.name,port:r.port})});
}
async function stop(c){await act(c,'POST',canvasPath(c)+'/stop',tr('l.stopping'),function(){return tr('l.stopped',{name:c.name})})}
async function remove(c){
  var info;
  try{info=await api('GET',canvasPath(c))}catch(e){say(e.message,false);return}
  var s=info.stats||{};
  var text=tr('l.confirm',{name:c.name,id:canvasLabel(c),port:c.port,active:s.comments_active||0,total:s.comments_total||0,snaps:s.snapshots||0,kb:Math.round((s.size_bytes||0)/1024)});
  if(!window.confirm(text))return;
  await act(c,'DELETE',canvasPath(c),tr('l.removing'),function(r){return tr('l.removed',{name:c.name,trash:r.trash||'trash/'})});
}
var langSel=document.getElementById('lang-select');
fetch('/api/lang',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){langSel.value=d.lang||'auto'}).catch(function(){});
langSel.addEventListener('change',async function(){
  try{
    var res=await fetch('/api/lang',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang:langSel.value})});
    var d={};try{d=await res.json()}catch(e){}
    if(!res.ok)throw new Error(d.error||tr('l.reqFailed',{status:res.status}));
    location.reload();
  }catch(e){say(e.message,false)}
});
refresh();timer=setInterval(refresh,5000);
})();
</script>
</body>
</html>
